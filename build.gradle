
buildscript {
    //-------VERSIONING-------
    def versionPropsFile = file('version.properties')
    Properties versionProps = new Properties()

    versionProps.load(new FileInputStream(versionPropsFile))

    def isSnapshot     = versionProps['version.snapshot'].toBoolean()
    def version_stage= versionProps['version.stage'].toString()

    def version_major  = versionProps['version.major'].toInteger()
    def version_minor  = versionProps['version.minor'].toInteger()
    def version_patch  = versionProps['version.patch'].toInteger()
    def version_build  = versionProps['version.build'].toInteger()


    if (isSnapshot) {
        version = "${version_major}.${version_minor}.${version_patch}${version_stage}-snapshot-${version_build}"
        System.out.println("VERSIONING-SNAPSHOT")
    } else {
        version = "${version_major}.${version_minor}.${version_patch}${version_stage}"
        System.out.println("VERSIONING-RELEASE")

    }

    project.version = version
    //-------VERSIONING END-------
}

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.architectury)
    alias(libs.plugins.architectury.loom)  apply false
}

group = project_group
// PORT-26.1: Gradle 9 removed Project.archivesBaseName in favour of the base extension
base.archivesName = project_name

architectury {
    minecraft = libs.versions.minecraftVersion.get()
}


subprojects {

    apply plugin: "java"
    apply plugin: "java-library"

    apply plugin: libs.plugins.architectury.asProvider().get().pluginId

    apply plugin: libs.plugins.architectury.loom.get().pluginId



    group = rootProject.group
    version = rootProject.version
    base.archivesName = project_name

    java {
        // PORT-26.1: MC 26.1 needs Java 25. Pinning a toolchain (rather than relying on the JVM
        // that launched Gradle) keeps the build working from the IDE and CI, which may still
        // start Gradle on an older JDK - Gradle forks a 25 compiler either way.
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // PORT-26.1: MC 26.1 runs on Java 25 (javaVersion.majorVersion 25 in the version manifest)
        options.release.set(25)
    }


    dependencies {
        minecraft "com.mojang:minecraft:${libs.versions.minecraftVersion.get()}"
        // PORT-26.1: no `mappings` dependency. 26.1 is unobfuscated, so Mojang publishes no
        // mapping files, Fabric retired intermediary and yarn, and parchment has no 26.x release.
        // The loom-no-remap plugin expects the configuration to be empty - supplying anything
        // here (even the intermediary:0.0.0 stub) fails remapping against a missing `named` ns.

        compileOnly(libs.lwjgl.openxr)
        compileOnly(libs.lwjgl.vulkan)

        compileOnly(libs.bundles.annotations)
        annotationProcessor(libs.bundles.annotations)

    }


}

allprojects {

    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://libraries.minecraft.net/" }

        maven { url 'https://jitpack.io' }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url 'https://redempt.dev' }

        // ---- LOCAL DEPENDENCY
        flatDir {
            dirs rootProject.file('libs')
        }
        // ----

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }
    // ---- LOCAL DEPENDENCY
    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
    // ----
    compileJava {
        dependsOn(clean)
    }

}


// PORT: temporary
subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xmaxerrs" << "10000"
    }
}

// PORT-26.1: the two Forge workarounds that lived here - `prepareConflictFreeSrgMappings` and
// the remap `targetNamespace` override - are gone. Both existed only to referee the named -> srg
// mapping step, and 26.1 has no srg namespace at all: the game ships unobfuscated and the
// NeoForge/Forge moddev configs carry no mapping entries. With loom-no-remap there is no
// remapJar task for them to configure either.
