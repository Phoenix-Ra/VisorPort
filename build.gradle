
buildscript {
    //-------VERSIONING-------
    def versionPropsFile = file('version.properties')
    Properties versionProps = new Properties()

    versionProps.load(new FileInputStream(versionPropsFile))

    def isSnapshot     = versionProps['version.snapshot'].toBoolean()
    def version_stage= versionProps['version.stage'].toString()

    def version_major  = versionProps['version.major'].toInteger()
    def version_minor  = versionProps['version.minor'].toInteger()
    def version_patch  = versionProps['version.patch'].toInteger()
    def version_build  = versionProps['version.build'].toInteger()


    if (isSnapshot) {
        version = "${version_major}.${version_minor}.${version_patch}${version_stage}-snapshot-${version_build}"
        System.out.println("VERSIONING-SNAPSHOT")
    } else {
        version = "${version_major}.${version_minor}.${version_patch}${version_stage}"
        System.out.println("VERSIONING-RELEASE")

    }

    project.version = version
    //-------VERSIONING END-------
}

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.architectury)
    alias(libs.plugins.architectury.loom)  apply false
}

group = project_group
archivesBaseName = project_name

architectury {
    minecraft = libs.versions.minecraftVersion.get()
}


subprojects {

    apply plugin: "java"
    apply plugin: "java-library"

    apply plugin: libs.plugins.architectury.asProvider().get().pluginId

    apply plugin: libs.plugins.architectury.loom.get().pluginId



    group = rootProject.group
    version = rootProject.version
    archivesBaseName = project_name
    loom {
        silentMojangMappingsLicense()
    }

    java {
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }


    dependencies {
        minecraft "com.mojang:minecraft:${libs.versions.minecraftVersion.get()}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${libs.versions.minecraftVersion.get()}:${libs.versions.parchment.get()}@zip")
        }


        compileOnly(libs.lwjgl.openxr)
        compileOnly(libs.lwjgl.vulkan)

        compileOnly(libs.bundles.annotations)
        annotationProcessor(libs.bundles.annotations)

    }


}

allprojects {

    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://libraries.minecraft.net/" }

        maven { url 'https://jitpack.io' }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url 'https://redempt.dev' }
        maven { url = "https://maven.parchmentmc.org" }

        // ---- LOCAL DEPENDENCY
        flatDir {
            dirs rootProject.file('libs')
        }
        // ----

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }
    // ---- LOCAL DEPENDENCY
    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
    // ----
    compileJava {
        dependsOn(clean)
    }

}


// PORT: temporary
subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xmaxerrs" << "10000"
    }
}

// PORT-1.21.11: Forge 61's net.minecraftforge.network.ForgePayload implements BOTH
// CustomQueryPayload and CustomQueryAnswerPayload, whose write(FriendlyByteBuf) methods carry
// DIFFERENT srg ids (m_294761_ / m_295630_). When remapJar maps named -> srg, tiny-remapper
// propagates member names across that bridge class, ends up with two candidate names for one
// method family, and aborts with "Unfixable conflicts" - arch-loom 1.14's TinyRemapperService
// never sets ignoreConflicts (its other remap paths do), and no newer 1.14 snapshot exists.
// Forge's own toolchain hit the same clash and shipped ForgePayload with just m_295630_.
//
// Visor references none of these classes, so the remapped jar's bytes do not depend on which
// id wins - only the analysis has to stop seeing two names. The remap tasks are fed a copy of
// the platform mappings with the answer-side write ids rewritten onto the query-side id: the
// family becomes uniform, the conflict disappears, and the dev-time mappings plus every other
// consumer keep the untouched file. If a future Forge/loom bump changes these entries the
// rewrite quietly matches nothing and the conflict resurfaces loudly - that is intended.
subprojects {
    plugins.withId('dev.architectury.loom') {
        def loomExt = project.extensions.getByName('loom')
        if (!loomExt.isForge()) {
            return
        }
        def fixedMappings = project.layout.buildDirectory.file('loom-cache/conflict-free-srg-mappings.tiny')
        def fixTask = project.tasks.register('prepareConflictFreeSrgMappings') {
            def platformMappings = project.provider {
                net.fabricmc.loom.LoomGradleExtension.get(project).getPlatformMappingFile().toFile()
            }
            inputs.file(platformMappings)
            outputs.file(fixedMappings)
            doLast {
                def answerClasses = [
                        'net/minecraft/network/protocol/login/custom/CustomQueryAnswerPayload',
                        'net/minecraft/network/protocol/login/custom/DiscardedQueryAnswerPayload'
                ]
                def source = platformMappings.get()
                def target = fixedMappings.get().asFile
                target.parentFile.mkdirs()
                def srgField = -1
                def namedField = -1
                def maxField = -1
                def inAnswerClass = false
                target.withWriter('UTF-8') { writer ->
                    source.eachLine('UTF-8') { line ->
                        def fields = line.split('\t', -1)
                        if (srgField < 0 && fields.length > 3 && fields[0] == 'tiny') {
                            for (def i = 3; i < fields.length; i++) {
                                if (fields[i] == 'srg') srgField = i - 3
                                if (fields[i] == 'named') namedField = i - 3
                            }
                            maxField = srgField > namedField ? srgField : namedField
                        } else if (fields.length > 0 && fields[0] == 'c') {
                            inAnswerClass = namedField >= 0
                                    && fields.length > 1 + namedField
                                    && answerClasses.contains(fields[1 + namedField])
                        } else if (inAnswerClass
                                && srgField >= 0
                                && fields.length > 3 + maxField
                                && fields[0] == '' && fields[1] == 'm'
                                && fields[3 + namedField] == 'write'
                                && fields[3 + srgField] == 'm_295630_') {
                            fields[3 + srgField] = 'm_294761_'
                            line = fields.join('\t')
                        }
                        writer.write(line)
                        writer.write('\n')
                    }
                }
            }
        }
        project.tasks.withType(net.fabricmc.loom.task.AbstractRemapJarTask).configureEach {
            dependsOn(fixTask)
            customMappings.from(fixedMappings)
        }
    }
}
