

[versions]
#Gradle Addons
shadow              = "8.1.1"
architectury        = "3.5-SNAPSHOT"
# Pinned to the 1.14 line on purpose: loom jumps 1.14 -> 1.17 (no 1.15/1.16) and 1.17
# is built against the Gradle 9 API (Configuration.extendsFrom(Provider[])), which
# Gradle 8.14.3 does not have. Moving to 1.17 means bumping the wrapper to Gradle 9 and
# replacing com.github.johnrengelman.shadow, which is abandoned and Gradle-9-incompatible.
architectury-loom   = "1.14-SNAPSHOT"


#Annotations
lombok                 = "1.18.46"
jetbrains              = "26.1.0"

#Core
minecraftVersion       = "1.21.11"
parchment              = "2025.12.20"
lwjgl                  = "3.3.6"
atum-vr                = "1.13.0beta"
atum-config            = '1.2.0pre3'

#Fabric
fabric-loader          = "0.19.3"
fabric_api             = "0.141.6"
mixinExtras            = "0.5.4"

#Forge
forgeVersion           = "61.2.1"

#NeoForge
neoforgeVersion        = "21.11.45"

#Other mods
# 0.8.7 is the newest sodium build for 1.21.11 made with loom 1.13.4; everything from
# 0.8.11 up is built with loom 1.16.1, which loom 1.14 refuses to consume ("Mod was built
# with a newer version of Loom"). This is modCompileOnly, so it only sets what the sodium
# compat mixins compile against -- revisit together with the Gradle 9 / loom 1.17 move.
mods_sodium                 = "mc1.21.11-0.8.7-fabric"
mods_iris                   = "1.10.7+1.21.11-fabric"


[plugins]
architectury         = { id = "architectury-plugin",            version.ref = "architectury" }
architectury-loom    = { id = "dev.architectury.loom",          version.ref = "architectury-loom" }
shadow               = { id = "com.github.johnrengelman.shadow",  version.ref = "shadow" }


[libraries]

# Annotations
lombok           = { module = "org.projectlombok:lombok",           version.ref = "lombok" }
jetbrains        = { module = "org.jetbrains:annotations",         version.ref = "jetbrains" }

# Core
lwjgl-openxr       = { module = "org.lwjgl:lwjgl-openxr",           version.ref = "lwjgl" }
lwjgl-vulkan       = { module = "org.lwjgl:lwjgl-vulkan",           version.ref = "lwjgl" }
atumvr-api         = { module = "com.github.Phoenix-Ra.AtumVR:atumvr-api",     version.ref = "atum-vr"}
atumvr-core        = { module = "com.github.Phoenix-Ra.AtumVR:atumvr-core",    version.ref = "atum-vr"}
atumvr-config      = { module = "com.github.Phoenix-Ra:AtumConfiguration",    version.ref = "atum-config"}
# Mod loaders
fabric-loader      = { module = "net.fabricmc:fabric-loader",        version.ref = "fabric_loader" }

#Other Mods
mod-sodium = { module = "maven.modrinth:sodium",  version.ref = "mods_sodium"}
mod-iris   = { module = "maven.modrinth:iris",    version.ref = "mods_iris"}

[bundles]
annotations        = [ "lombok", "jetbrains" ]


