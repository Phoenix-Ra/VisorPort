

[versions]
#Gradle Addons
# PORT-26.1: com.github.johnrengelman.shadow is abandoned and does not run on Gradle 9.
# com.gradleup.shadow is the maintained fork and the drop-in successor; the task/DSL names
# (shadowJar, relocate, configurations) are unchanged.
shadow              = "9.6.1"
architectury        = "3.5.169"
# PORT-26.1: was pinned to the 1.14 line to stay on Gradle 8.14.3. That pin is gone: MC 26.1 is
# unobfuscated, and only loom >= 1.14 supports it - via a DIFFERENT PLUGIN ID (see [plugins]).
# Loom 1.14 already requires Gradle 9.2 and 1.16 requires Gradle 9.4, so the wrapper moves to 9.x
# and shadow had to be replaced along with it.
architectury-loom   = "1.17.491"


#Annotations
lombok                 = "1.18.46"
jetbrains              = "26.1.0"

#Core
# PORT-26.1: 26.1 is the first UNOBFUSCATED Minecraft. The client jar ships real net/minecraft
# names, Mojang no longer publishes client_mappings/server_mappings, Fabric retired intermediary
# (26.x resolves to a header-only intermediary:0.0.0 stub) and yarn stopped at 1.21.11. There is
# no mappings layer left to configure - see the removed `mappings` block in build.gradle.
# 26.1.2 is the newest patch of the 26.1 line and the one Forge/NeoForge/Sodium/Iris build against.
minecraftVersion       = "26.1.2"
# PORT-26.1: parchment removed - parchmentmc publishes nothing for 26.x (parchment-26.1* is a 404),
# and it has nothing left to add now that the jar carries real names and parameter names.
lwjgl                  = "3.4.1"
atum-vr                = "1.13.0beta"
atum-config            = '1.2.0pre3'

#Fabric
fabric-loader          = "0.19.3"
fabric_api             = "0.155.2"
mixinExtras            = "0.5.4"

#Forge
# PORT-26.1: full coordinate is 26.1.2-64.1.2
forgeVersion           = "64.1.2"

#NeoForge
# PORT-26.1: NeoForge now versions off the MC version directly (26.1.2.x tracks MC 26.1.2)
neoforgeVersion        = "26.1.2.97"

#Other mods
# PORT-26.1: both rebuilt for the unobfuscated 26.1.2. Sodium 0.9.1 is the newest stable for
# 26.1.2 (0.9.2 is still alpha); this is compileOnly, so it only sets what the sodium compat
# mixins compile against.
mods_sodium                 = "mc26.1.2-0.9.1-fabric"
mods_iris                   = "1.11.3+26.1-fabric"


[plugins]
architectury         = { id = "architectury-plugin",            version.ref = "architectury" }
# PORT-26.1: loom ships three plugin ids since 1.14 - `dev.architectury.loom` (legacy/compat),
# `dev.architectury.loom-remap` (obfuscated versions) and `dev.architectury.loom-no-remap` for the
# unobfuscated ones. On 26.1 the no-remap id is the only one that configures: the others still
# demand a `named` namespace that no artifact can supply any more. It also removes remapJar and
# the modImplementation/modApi/modCompileOnly configurations - mods are plain dependencies now.
architectury-loom    = { id = "dev.architectury.loom-no-remap", version.ref = "architectury-loom" }
shadow               = { id = "com.gradleup.shadow",            version.ref = "shadow" }


[libraries]

# Annotations
lombok           = { module = "org.projectlombok:lombok",           version.ref = "lombok" }
jetbrains        = { module = "org.jetbrains:annotations",         version.ref = "jetbrains" }

# Core
lwjgl-openxr       = { module = "org.lwjgl:lwjgl-openxr",           version.ref = "lwjgl" }
lwjgl-vulkan       = { module = "org.lwjgl:lwjgl-vulkan",           version.ref = "lwjgl" }
atumvr-api         = { module = "com.github.Phoenix-Ra.AtumVR:atumvr-api",     version.ref = "atum-vr"}
atumvr-core        = { module = "com.github.Phoenix-Ra.AtumVR:atumvr-core",    version.ref = "atum-vr"}
atumvr-config      = { module = "com.github.Phoenix-Ra:AtumConfiguration",    version.ref = "atum-config"}
# Mod loaders
fabric-loader      = { module = "net.fabricmc:fabric-loader",        version.ref = "fabric_loader" }

#Other Mods
mod-sodium = { module = "maven.modrinth:sodium",  version.ref = "mods_sodium"}
mod-iris   = { module = "maven.modrinth:iris",    version.ref = "mods_iris"}

[bundles]
annotations        = [ "lombok", "jetbrains" ]


